<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Gradientes para darle volumen similar al original -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Diente (contorno exterior) -->
  <path d="M 200 65
           C 120 65, 80 140, 110 210
           C 120 235, 150 310, 160 310
           C 175 310, 185 240, 200 180
           C 215 240, 225 310, 240 310
           C 250 310, 280 235, 290 210
           C 320 140, 280 65, 200 65 Z"
        fill="none"
        stroke="url(#silverGrad)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Logo interior: E y E invertida -->
  <g transform="translate(0, -10)">
    <!-- E izquierda -->
    <path d="M 185 130 L 135 130 L 135 210 L 185 210 M 135 170 L 175 170" 
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="miter" stroke-linecap="square"/>
    <!-- E derecha (invertida) -->
    <path d="M 215 130 L 265 130 L 265 210 L 215 210 M 265 170 L 225 170" 
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="miter" stroke-linecap="square"/>
  </g>

  <!-- Texto ESPER ODONTOLOGÍA -->
  <text x="200" y="350" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="1">ESPER ODONTOLOGÍA</text>
        
  <!-- Texto MENDOZA -->
  <text x="200" y="380" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="18" 
        font-weight="400" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="4">MENDOZA</text>
</svg>
